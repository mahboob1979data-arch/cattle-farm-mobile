name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Standalone Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cattle-farm-app
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-release
          name: Cattle Farm App (Release)
          body: |
            This is the standalone Release APK of the Cattle Farm mobile app.
            Download the `app-release.apk` file directly below to install it on your Android phone.
            No computer or server connection is required to run this app!
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/app-release.apk
